name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postmark-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.resolution }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        laravel: ['12', '13']
        resolution: [latest, lowest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl, dom, xml, pdo_sqlite
          coverage: none
          tools: composer:v2
      - name: Test isolated consumer and shared regression suite
        run: bash tools/check-matrix.sh '${{ matrix.laravel }}' '${{ matrix.resolution }}'

  quality:
    name: PHPStan 9, coverage, mutation tests, and style
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: mbstring, curl, dom, xml, pdo_sqlite
          coverage: xdebug
          tools: composer:v2
      - run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer audit --locked
      - run: composer test:analyse
      - run: composer test:lint
      - run: composer test:coverage
        env:
          XDEBUG_MODE: coverage
      - run: composer test:mutate
        env:
          XDEBUG_MODE: coverage
